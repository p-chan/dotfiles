onboarding = false

[theme]
name = "one-dark"

# 色は ghostty に移植されたものではなく、VS Code の "One Dark Pro" テーマ（Binaryify/OneDark-Pro）から取っている
# この拡張機能が、このパレットの本来の出典であるため
[theme.custom]
# editor.background
panel_bg = "#282c34"
accent = "#61afef"
text = "#abb2bf"
# statusBar.foreground
subtext0 = "#9da5b4"
mauve = "#c678dd"
green = "#98c379"
yellow = "#e5c07b"
red = "#e06c75"
blue = "#61afef"
teal = "#56b6c2"
peach = "#d19a66"
# sideBar.background
surface0 = "#21252b"
# list.hoverBackground / list.activeSelectionBackground
surface1 = "#2c313a"
# One Dark Pro list.activeSelectionBackground.
active_row_bg = "#2c313a"
# editorGroup.background（パレットで最も暗い色）
surface_dim = "#181a1f"
# herdr は overlay0 を枠線だけでなく、サイドバーの太字の見出しやボタン（Spaces、Agents、new、menu、priority sort）にも使うので、読める明るさを保つ
# comment
overlay0 = "#7f848e"
# statusBar.foreground（subtext0 と同じ）
# herdr は overlay1 を装飾だけでなく、読ませるヒントやラベルのテキスト（設定、オンボーディング）にも使うため
overlay1 = "#9da5b4"

[keys]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[ui]
pane_borders = "always"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
# 空のリストにしないのは、vim のペインでノーマルモードのときにカーソルを隠したままにするため
cjk_ime_agents = ["claude", "codex"]
