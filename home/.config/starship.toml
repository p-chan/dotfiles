"$schema" = "https://starship.rs/config-schema.json"

format = "$character${custom.dir}${custom.git_branch}"
right_format = "$time"
add_newline = false
command_timeout = 1000

[character]
format = "[⋊>](blue) "

[custom.dir]
command = "source starship-dir"
shell = ["/bin/bash", "--noprofile", "--norc"]
when = true
format = "[$output](yellow) "

[custom.git_branch]
command = 'git status --porcelain --branch 2>/dev/null | { IFS= read -r branch || exit; IFS= read -r _ && dirty="*" || dirty=""; branch=${branch#\#\# }; branch=${branch%%...*}; branch=${branch%% *}; printf "%s%s" "$branch" "$dirty"; }'
shell = ["/bin/sh"]
require_repo = true
when = true
format = "on [$output](green) "

[time]
format = "[$time](#999999)"
disabled = false
