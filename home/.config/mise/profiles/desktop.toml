[bootstrap.packages]
"brew:defaultbrowser" = "latest"
"brew:dockutil" = "latest"

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleInterfaceStyle = "Dark", AppleShowAllExtensions = true, NSNavPanelExpandedStateForSaveMode = true, "com.apple.trackpad.scaling" = 1.5 }
"com.apple.dock" = { wvous-tr-corner = 2, wvous-tr-modifier = 0, wvous-bl-corner = 4, wvous-bl-modifier = 0, autohide-delay = 0 }
"com.apple.finder" = { _FXSortFoldersFirst = true, FXPreferredViewStyle = "clmv", CreateDesktop = false, NewWindowTarget = "PfHm", AppleShowAllFiles = true }
"com.apple.AppleMultitouchTrackpad" = { Clicking = true, TrackpadThreeFingerTapGesture = 0 }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { Clicking = true, TrackpadThreeFingerTapGesture = 0 }

[bootstrap.hooks]
pre-packages = 'if command -v brew >/dev/null 2>&1; then brew bundle --file="$(mise settings get dotfiles.root)/.config/homebrew/profiles/Brewfile.desktop"; fi'
final = 'mise run -C "$HOME" bootstrap-desktop'

[bootstrap.services.herdr-sync-pane-labels]
scope = "user"
command = "~/.local/bin/mise exec -- node .config/herdr/services/sync-pane-labels/daemon.mjs"
working_directory = "~"
restart = "always"
requires_tools = true

[dotfiles]
"~/.config/ghostty" = {}
"~/.config/karabiner" = {}
# Zed は生成した状態（prompts/、themes/）を ~/.config/zed に書き込むので、ディレクトリ全体ではなく settings.json だけをリンクする
"~/.config/zed/settings.json" = {}
