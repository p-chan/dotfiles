[tools]
node = "lts"
bun = "latest"
"github:ajeetdsouza/zoxide" = "latest"
"github:BurntSushi/ripgrep" = "latest"
"github:sharkdp/bat" = "latest"
"github:cli/cli" = "latest"
"github:github/copilot-cli" = "latest"
"github:jkfran/killport" = "latest"
"github:ogulcancelik/herdr" = "latest"
"github:junegunn/fzf" = "latest"
"github:k1LoW/git-wt" = "latest"
"github:rossmacarthur/sheldon" = "latest"
"github:sharkdp/fd" = "latest"
"github:starship/starship" = "latest"
"github:suzuki-shunsuke/pinact" = "latest"
"github:sxyazi/yazi" = "latest"
"github:tmux/tmux-builds" = "latest"
"github:tokuhirom/mdroll" = "latest"
"github:x-motemen/ghq" = "latest"
"npm:@antfu/ni" = "latest"
"npm:@playwright/cli" = "latest"
"npm:editorconfig-checker" = "latest"
"npm:fixpack" = "latest"
"npm:hunkdiff" = "latest"
"npm:npmrc" = "latest"
"npm:ntn" = "latest"
"npm:opensrc" = "latest"
"npm:pnpm" = { version = "latest", allow_builds = ["pnpm"] }
"npm:yarn" = "latest"

[tools."github:jqlang/jq"]
version = "latest"

[tools."github:jqlang/jq".platforms]
macos-x64 = { asset_pattern = "jq-macos-amd64" }
macos-arm64 = { asset_pattern = "jq-macos-arm64" }

# openai/codex は codex で始まるリリースアセット（codex-app-server、codex-command-runner、codex-symbols など）を数十個配布しているので、mise のデフォルトのアセットのマッチングでは区別できない
# また、codex-*.zst にはメインのバイナリしか含まれないが、code mode では codex が別の codex-code-mode-host を起動する必要がある
# そこで、パッケージのアーカイブを指定する
# アーカイブは両方を bin/ にまとめて含み（codex が必要とする rg と zsh のリソースも含む）、1 つのバージョンで両者を揃えられるため
[tools."github:openai/codex"]
version = "latest"

[tools."github:openai/codex".platforms]
macos-arm64 = { asset_pattern = "codex-package-aarch64-apple-darwin.tar.zst", bin_path = "bin" }

# opencode のリリースには CLI のアーカイブと並んでデスクトップアプリの macOS 向けアーカイブ（opencode-desktop-mac-arm64.zip、.dmg など）が含まれ、mise のデフォルトのアセットのマッチングでは区別できない
# そのため、CLI のアーカイブを明示的に指定する
[tools."github:anomalyco/opencode"]
version = "latest"

[tools."github:anomalyco/opencode".platforms]
macos-arm64 = { asset_pattern = "opencode-darwin-arm64.zip" }

[settings]
experimental = true
idiomatic_version_file_enable_tools = ['node']
npm.shell_out = true
# dotfiles.root はマシンごとに異なる（マシンごとにこのリポジトリを別のパスにチェックアウトする）ので、conf.d/dotfiles-root.toml に置く
# このファイルは scripts/install.sh が生成し、Git の管理対象外にしている
# settings の値はリテラルとして扱われ（mise は環境変数やテンプレートを展開しない）、パスをここで宣言できないため
# conf.d の設定は、このファイルより優先される
dotfiles.default_mode = "symlink"

[settings.github]
# credential_command は、mise の再帰的な呼び出しを避けるため、mise の shim を PATH から除いて実行される
# ここでは gh を mise の shim としてしかインストールしていないので、`gh` だけでは解決できない
# credential_command の中で `mise which gh` を呼べば回避できるが、mise のドキュメントはこれを推奨していない
# gh 自体が github:cli/cli なので、解決に GitHub のトークンが必要になり、同じ credential_command を再帰的に呼ぶ可能性があるため
# mise の github バックエンドは、解決したバージョンの隣に `latest` のシンボリックリンク（installs/github-cli-cli/latest -> ./2.96.0 など）を置き、アップグレードのたびに張り替える
# そのため、このパスは mise を呼ばなくても常に有効
credential_command = "$HOME/.local/share/mise/installs/github-cli-cli/latest/bin/gh auth token"

[bootstrap.hooks]
pre-packages = 'if command -v brew >/dev/null 2>&1; then brew bundle --file="$(mise settings get dotfiles.root)/.config/homebrew/Brewfile"; fi'

[bootstrap.packages]
"brew:git" = "latest"
"brew:mosh" = "latest"
"brew:tailscale" = "latest"
"brew:vim" = "latest"
"brew:zsh" = "latest"

[dotfiles]
"~/.agents" = {}
"~/.claude/CLAUDE.md" = {}
"~/.claude/commands" = {}
"~/.claude/hooks" = {}
"~/.claude/rules" = {}
"~/.claude/settings.json" = {}
"~/.claude/skills" = {}
"~/.claude/statusline.sh" = {}
"~/.codex/AGENTS.md" = {}
"~/.codex/skills" = {}
"~/.config/fixpack" = {}
"~/.config/gh/config.yml" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/herdr/services" = {}
"~/.config/homebrew" = {}
"~/.config/hunk/config.toml" = {}
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/opencode/AGENTS.md" = {}
"~/.config/opencode/opencode.jsonc" = {}
"~/.config/ripgrep" = {}
"~/.config/sheldon" = {}
"~/.config/tmux" = {}
"~/.config/vim" = {}
"~/.config/yazi" = {}
"~/.config/zsh" = {}
"~/.config/zsh-abbr" = {}
"~/.config/starship.toml" = {}
"~/.ssh" = {}
"~/.editorconfig" = {}
"~/.zshenv" = {}
