name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  get-cask-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: get
        name: Get cask packages
        run: |
          echo "packages=$(
            grep -h '^cask ' \
              home/.config/homebrew/Brewfile \
              home/.config/homebrew/profiles/Brewfile.* | \
            sed 's/^cask //g' | \
            xargs
          )" >> $GITHUB_OUTPUT

  install:
    needs: [get-cask-packages]
    runs-on: macos-26
    defaults:
      run:
        shell: zsh -l {0}
    # mise が github: のツールを解決するときに、認証なしの GitHub API のレート制限にかからないようにする
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # チェックアウトした場所をそのまま dotfiles の場所として使う
      # install.sh が生成するマシン固有の mise の設定に $DOTFILES_DIR を記録するので、固定のパスは不要
      - name: Install
        run: |
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
          DOTFILES_PROFILES="desktop,server" \
          NONINTERACTIVE=1 \
          HOMEBREW_BUNDLE_CASK_SKIP="${{ needs.get-cask-packages.outputs.packages }}" \
          MISE_GPG_VERIFY=false \
          bash scripts/install.sh
      - name: Doctor
        run: zsh scripts/doctor.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install
      - name: Setup editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - run: editorconfig-checker
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - run: node --test .github/scripts/check-pr-title.test.ts scripts/*.test.ts home/.agents/skills/*/scripts/*.test.ts home/.config/herdr/services/*/*.test.mjs
