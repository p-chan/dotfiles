name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  get-cask-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - id: get
        name: Get cask packages
        run: |
          echo "packages=$(
            grep -h '^cask ' \
              home/.config/homebrew/Brewfile \
              home/.config/homebrew/profiles/Brewfile.* | \
            sed 's/^cask //g' | \
            xargs
          )" >> $GITHUB_OUTPUT

  install:
    needs: [get-cask-packages]
    runs-on: macos-15
    defaults:
      run:
        shell: zsh -l {0}
    steps:
      - uses: actions/checkout@v5
      # The checkout is used as the dotfiles location as-is: install.sh
      # records $DOTFILES_DIR in the machine-local mise config it generates,
      # so no fixed path is required.
      - name: Install
        run: |
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
          DOTFILES_PROFILES="desktop,server" \
          NONINTERACTIVE=1 \
          HOMEBREW_BUNDLE_CASK_SKIP="${{ needs.get-cask-packages.outputs.packages }}" \
          MISE_GPG_VERIFY=false \
          bash scripts/install.sh
      - name: Doctor
        run: zsh scripts/doctor.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Setup editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@main
      - run: editorconfig-checker
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - run: node --test .github/scripts/check-pr-title.test.ts scripts/*.test.ts
