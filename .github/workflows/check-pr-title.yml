name: Check PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Check PR Title
        # タイトルを run に直接展開すると、タイトルに含めたシェル構文が実行されるので、環境変数を経由して渡す
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node .github/scripts/check-pr-title.ts "$PR_TITLE"
